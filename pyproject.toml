[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family-insurance-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["langgraph", "chromadb", "rank-bm25", "neo4j", "anthropic", "fastapi", "uvicorn", "pydantic", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
